name: sparklearn
description: SparkLearn - supportive learning app with parent dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  http: ^1.2.2
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # UI / animation
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.5.0

  # Voice / accessibility
  speech_to_text: 7.0.0
  flutter_tts: ^4.0.2
  intl: ^0.19.0

  # Utilities
  uuid: ^4.5.1
  collection: ^1.18.0
  firebase_app_check: ^0.3.2+10
  flutter_dotenv: ^6.0.0

dev_dependencies:
  http: ^1.2.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - .env